# capraetech.io: the Book a call form posts to /book-a-call/ (a real page) instead of /api/contact,
# so the site's JavaScript names no URL that Google can crawl into a 405 (D-109).
# nginx hands the POST to the existing location = /api/contact, which is left exactly as it is.
# Paste inside the capraetech.io server { } block, at server level (NOT inside a location { }), then:
#   sudo nginx -t && sudo systemctl reload nginx

    # POST /book-a-call/ -> the contact server. GET /book-a-call/ still serves the page as before.
    if ($request_method = POST) {
        rewrite ^/book-a-call/?$ /api/contact last;
    }
