# capraetech.io: serve the AI Information page (public/ai-information.md) as readable text.
# nginx has no type for .md, so without this a browser downloads the file instead of showing it.
# Same rule as capraecapital.com. Paste inside the capraetech.io server { } block, then:
#   sudo nginx -t && sudo systemctl reload nginx

    # /ai-information and /ai-information/ go to the Markdown file
    location ~ ^/ai-information/?$ { return 301 /ai-information.md; }

    # shown in the browser as UTF-8 text, and readable by AI crawlers
    location = /ai-information.md {
        types { }
        default_type "text/plain; charset=utf-8";
        try_files $uri =404;
    }

    # the old Terms URL (the page moved to /terms-and-conditions/ on 2026-10-21)
    location ~ ^/terms/?$ { return 301 /terms-and-conditions/; }
