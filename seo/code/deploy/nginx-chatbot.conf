# capraetech.io: the site assistant API (seo/code/chatbot/app.py on 127.0.0.1:8096).
# Same rules as capraecapital.com's /api/chat. Then: sudo nginx -t && sudo systemctl reload nginx

# 1) In the http { } context (top of the site file, outside server { }): per-IP request limit.
limit_req_zone $binary_remote_addr zone=capraetech_chat:10m rate=10r/m;

# 2) Inside the capraetech.io server { } block, next to the existing location = /api/contact:
    location = /api/chat {
        limit_req zone=capraetech_chat burst=5 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location = /api/chat/health { proxy_pass http://127.0.0.1:8096; }
