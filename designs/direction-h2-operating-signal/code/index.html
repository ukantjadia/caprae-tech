      rel="stylesheet"
    />
    <script>
      /* Counterpart to the gallery 404 shim: a deep link arrives as ?p=/route,
         so put the real path back before React Router reads it. */
      (function () {
        var m = /[?&]p=([^&]*)/.exec(window.location.search);
        if (!m) return;
        var rest = window.location.search.replace(/[?&]p=[^&]*/, '').replace(/^&/, '?');
        history.replaceState(null, '', window.location.pathname.replace(/\/$/, '') + decodeURIComponent(m[1]) + rest + window.location.hash);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
