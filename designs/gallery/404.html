<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting</title>
    <script>
      /* GitHub Pages has no rewrite rule, so a direct hit on a client route
         inside a routed direction (…/h3/services) lands here instead of on its
         index. Hand the sub-path over as a query; that direction's own index
         puts it back.
         Only routed directions belong in this list, and the bare 'h' goes
         last: matched first it would truncate /h2/ and /h3/ to /h/. This
         replaces the pairwise check H2 added, which could not extend to a
         third. */
      (function () {
        var ROUTED = ['h2', 'h3', 'h'];
        var l = window.location;
        for (var i = 0; i < ROUTED.length; i++) {
          var seg = '/' + ROUTED[i] + '/';
          var cut = l.pathname.indexOf(seg);
          if (cut < 0) continue;
          var root = l.pathname.slice(0, cut + seg.length);
          var rest = l.pathname.slice(cut + seg.length);
          l.replace(root + '?p=/' + rest + l.search.replace('?', '&') + l.hash);
          return;
        }
        l.replace('/');
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to the <a href="./">gallery</a>.</p>
  </body>
</html>
